<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLATO v3.5</title></head><body><p>Opening PLATO…</p><script>
(async()=>{
  // Also handles the former root worker returning this alias at the root URL.
  const path=location.pathname;
  const root=new URL(path.replace(/\/v35\/(?:index\.html)?$/,'/'),location.origin);
  if(root.pathname.endsWith('/index.html'))root.pathname=root.pathname.slice(0,-10);
  if('serviceWorker' in navigator){
    try{
      for(const registration of await navigator.serviceWorker.getRegistrations())if(registration.scope===new URL('v35/',root).href)await registration.unregister();
      const registration=await navigator.serviceWorker.register(new URL('sw.js',root),{scope:root.href,updateViaCache:'none'});
      await registration.update();
      const worker=registration.installing||registration.waiting;
      if(worker&&worker.state!=='activated')await new Promise(resolve=>{const timer=setTimeout(resolve,8000);worker.addEventListener('statechange',()=>{if(worker.state==='activated'||worker.state==='redundant'){clearTimeout(timer);resolve();}});});
    }catch(_){ }
  }
  location.replace(root.href);
})();
</script><noscript><a href="../">Open PLATO</a></noscript></body></html>
